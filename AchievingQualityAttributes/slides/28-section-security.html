        <p><strong>Section 5: Security Tactics</strong></p>
        <p>Security tactics protect the system from unauthorized access while serving legitimate users.</p>
        <ul>
            <li><em>Resist Attacks</em> - Prevent unauthorized access</li>
            <li><em>Detect Attacks</em> - Identify when attacks occur</li>
            <li><em>Recover from Attacks</em> - Restore system after compromise</li>
        </ul>
        <p>Remember the CIA triad: Confidentiality, Integrity, Availability - plus non-repudiation, assurance, and auditing.</p>
