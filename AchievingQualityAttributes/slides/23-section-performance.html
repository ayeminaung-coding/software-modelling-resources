        <p><strong>Section 4: Performance Tactics</strong></p>
        <p>Performance is about generating responses within time constraints. We will explore three categories of tactics:</p>
        <ul>
            <li><em>Resource Demand</em> - Reducing the demand for resources</li>
            <li><em>Resource Management</em> - Managing available resources efficiently</li>
            <li><em>Resource Arbitration</em> - Scheduling and prioritizing resource access</li>
        </ul>
        <p>Goal: Minimize latency while maximizing throughput under varying load conditions.</p>
