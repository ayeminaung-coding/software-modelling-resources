        <p><strong>Section 6: Testability Tactics</strong></p>
        <p>Testability is about how easy it is to demonstrate faults through testing.</p>
        <ul>
            <li><em>Input/Output Control</em> - Control inputs and observe outputs</li>
            <li><em>Internal Monitoring</em> - Observe internal system state</li>
        </ul>
        <p>Key insight: If you cannot control inputs or observe outputs, you cannot effectively test the system.</p>
        <p>Modern shift-left testing means designing for testability from the start.</p>
