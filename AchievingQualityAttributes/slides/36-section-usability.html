        <p><strong>Section 7: Usability Tactics</strong></p>
        <p>Usability is about helping users accomplish their tasks effectively and efficiently.</p>
        <ul>
            <li><em>Runtime Tactics</em> - Support users during system operation</li>
            <li><em>Design-time Tactics</em> - Enable usability through architecture</li>
        </ul>
        <p>Two initiative types:</p>
        <ul>
            <li><em>User Initiative</em> - User controls the interaction (undo, cancel)</li>
            <li><em>System Initiative</em> - System guides the user (progress, notifications)</li>
        </ul>
    </script>
